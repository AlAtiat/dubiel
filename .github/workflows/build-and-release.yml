name: Build and Release Dubiel

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: dubiel-windows
          - os: macos-15
            artifact-name: dubiel-macos-arm64
            arch-suffix: arm64
          - os: macos-15-intel
            artifact-name: dubiel-macos-x86_64
            arch-suffix: x86_64
          - os: ubuntu-latest
            artifact-name: dubiel-linux-appimage
            build-target: appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Briefcase
        run: |
          python -m pip install -U pip
          python -m pip install -U briefcase

      # --- Create ---
      - name: Create (Linux)
        if: runner.os == 'Linux'
        run: briefcase create linux ${{ matrix.build-target }}

      - name: Create
        if: runner.os != 'Linux'
        run: briefcase create

      # --- Build ---
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: briefcase build linux ${{ matrix.build-target }}

      - name: Build
        if: runner.os != 'Linux'
        run: briefcase build

      # --- Package ---
      - name: Package (macOS — ad-hoc sign, no Apple certificate required)
        if: runner.os == 'macOS'
        run: briefcase package --adhoc-sign

      - name: Rename macOS DMG to stable architecture name
        if: runner.os == 'macOS'
        run: |
          for f in dist/*.dmg; do
            mv "$f" "dist/Dubiel-${{ matrix.arch-suffix }}.dmg"
          done

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux' && matrix.build-target == 'appimage'
        run: briefcase package linux appimage

      - name: Rename Linux AppImage to stable name
        if: runner.os == 'Linux' && matrix.build-target == 'appimage'
        run: |
          for f in dist/*.AppImage; do
            mv "$f" dist/Dubiel.AppImage
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: briefcase package

      - name: Rename Windows MSI to stable name
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-Item dist\*.msi | Select-Object -First 1
          Move-Item $msi.FullName dist\Dubiel.msi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pyproject version
        shell: bash
        run: |
          APP_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['briefcase']['version'])")
          EXPECTED="v${APP_VERSION}"
          ACTUAL="${GITHUB_REF_NAME}"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag '$ACTUAL' does not match pyproject version '$EXPECTED'."
            echo "Bump [tool.briefcase] version in pyproject.toml to match the tag (or vice versa)."
            exit 1
          fi
          echo "Tag matches pyproject version: $ACTUAL"

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ ("^##[[:space:]]+" ver "([^0-9].*)?$") {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See CHANGELOG for full details." > release_notes.md
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dubiel ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: false
