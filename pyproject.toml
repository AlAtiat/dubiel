# This project was generated with 0.4.4 using template: https://github.com/beeware/briefcase-template @ v0.4.4
[tool.briefcase]
project_name = "Dubiel"
bundle = "com.dubiel"
version = "0.0.1"
url = "https://www.researchgate.net/scientific-contributions/Dawadschargal-Dubiel-2004568897"
license = "GPL-3.0"
license-files = ["LICENSE"]
author = "Aun Al Atiat"
author_email = "aun@alatiat.com"

[tool.briefcase.app.dubiel]
formal_name = "Dubiel"
description = "Western-blot / SDS-PAGE annotator and densitometry quantifier."
long_description = """Dubiel is a desktop tool for quantifying protein gels and Western
blots from photographs. Draw a box per lane (or per band), optionally tag a molecular-
weight ladder, and it detects and integrates bands, calibrates molecular weights, and
exports labelled tables and figures — per-gel montages, electropherograms, 3D intensity
surfaces, trend lines, and combined multi-protein panels with Spearman correlation
heatmaps and significance-annotated bar charts.

Dedicated with gratitude to Prof. Dr. rer. nat. habil. Dawadschargal Dubiel.
"""

icon = "icons/dubiel"
splash_background_color = "#D3E6F5"
sources = [
    "src/dubiel",
]
test_sources = [
    "tests",
]


requires = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-image",
    "matplotlib",
    "pillow",
]
test_requires = [
    "pytest",
]

[tool.briefcase.app.dubiel.macOS]
universal_build = true
requires = [
    "toga-cocoa~=0.5.0",
    "std-nslog~=2.0.0",
]

[tool.briefcase.app.dubiel.linux]
requires = [
    "toga-gtk~=0.5.0",
]

[tool.briefcase.app.dubiel.linux.system.debian]
system_requires = [
    # Needed to compile pycairo wheel
    "libcairo2-dev",
    "libgirepository-2.0-dev",
]

system_runtime_requires = [
    # Needed to provide GTK and its GI bindings
    "gir1.2-gtk-3.0",
    "libgirepository-2.0-0",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3-module",
    # Needed to provide WebKit2 at runtime
    # Note: Debian 11 requires gir1.2-webkit2-4.0 instead
    # "gir1.2-webkit2-4.1",
]

[tool.briefcase.app.dubiel.linux.system.rhel]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo-gobject-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
]

system_runtime_requires = [
    # Needed to support Python bindings to GTK
    "gobject-introspection",
    # Needed to provide GTK
    "gtk3",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3",
    # Needed to provide WebKit2 at runtime
    # "webkit2gtk3",
]

[tool.briefcase.app.dubiel.linux.system.suse]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
]

system_runtime_requires = [
    # Needed to provide GTK
    "gtk3",
    # Needed to support Python bindings to GTK
    "gobject-introspection", "typelib(Gtk) = 3.0",
    # Dependencies that GTK looks for at runtime
    "libcanberra-gtk3-module",
    # Needed to provide WebKit2 at runtime
    # "libwebkit2gtk3", "typelib(WebKit2)",
]

[tool.briefcase.app.dubiel.linux.system.arch]
system_requires = [
    # Needed to compile pycairo wheel
    "cairo",
    # Needed to compile PyGObject wheel
    "gobject-introspection",
    # Runtime dependencies that need to exist so that the
    # Arch package passes final validation.
    # Needed to provide GTK
    "gtk3",
    # Dependencies that GTK looks for at runtime
    "libcanberra",
    # Needed to provide WebKit2
    # "webkit2gtk",
]

system_runtime_requires = [
    # Needed to provide GTK
    "gtk3",
    # Needed to provide PyGObject bindings
    "gobject-introspection-runtime",
    # Dependencies that GTK looks for at runtime
    "libcanberra",
    # Needed to provide WebKit2 at runtime
    # "webkit2gtk",
]

[tool.briefcase.app.dubiel.linux.appimage]
manylinux = "manylinux_2_28"

system_requires = [
    # Needed to compile pycairo wheel
    "cairo-gobject-devel",
    # Needed to compile PyGObject wheel
    "gobject-introspection-devel",
    # Needed to provide GTK
    "gtk3-devel",
    # Dependencies that GTK looks for at runtime, that need to be
    # in the build environment to be picked up by linuxdeploy
    "libcanberra-gtk3",
    "PackageKit-gtk3-module",
    "gvfs-client",
]

linuxdeploy_plugins = [
    "DEPLOY_GTK_VERSION=3 gtk",
]

[tool.briefcase.app.dubiel.linux.flatpak]
flatpak_runtime = "org.gnome.Platform"
flatpak_runtime_version = "48"
flatpak_sdk = "org.gnome.Sdk"

[tool.briefcase.app.dubiel.windows]
requires = [
    "toga-winforms~=0.5.0",
]

# Mobile deployments
[tool.briefcase.app.dubiel.iOS]
requires = [
    "toga-iOS~=0.5.0",
]

[tool.briefcase.app.dubiel.android]
requires = [
    "toga-android~=0.5.0",
]

base_theme = "Theme.MaterialComponents.Light.DarkActionBar"

build_gradle_dependencies = [
    "com.google.android.material:material:1.13.0",
    # Needed for DetailedList
    # "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0",
    # Needed for MapView
    # "org.osmdroid:osmdroid-android:6.1.20",
    # Needed for WebView
    # "androidx.webkit:webkit:1.15.0",
]

# Needed for WebView
# build_gradle_extra_content="""
# chaquopy.defaultConfig.staticProxy("toga_android.widgets.internal.webview")
# """

# Web deployments
[tool.briefcase.app.dubiel.web]
requires = [
    "toga-web~=0.5.0",
]

# gelanalyzer + dubiel both live under src/, so tests resolve them from there.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

